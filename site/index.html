<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de baterias automotivas com atendimento direto pelo WhatsApp.">
  <title>Teste Baterias | Catálogo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <h1 class="logo">⚡ Teste<span>Baterias</span></h1>
    <p class="slogan">Energia confiável para o seu veículo</p>
  </header>

  <main class="container">

    <!-- Barra de busca + botão que abre os filtros -->
    <section class="controles">
      <input type="search" id="busca" placeholder="Buscar por nome, amperagem, aplicação..." aria-label="Buscar produto">
      <button class="botao-filtros" id="botao-filtros" aria-expanded="false">
        Filtros <span class="badge" id="qtd-filtros" hidden>0</span> ▾
      </button>
    </section>

    <!-- Painel de filtros (começa fechado) -->
    <div class="painel-filtros" id="painel-filtros">
      <div class="painel-corte">
        <div class="painel-conteudo">

          <fieldset class="grupo-filtro">
            <legend>Categoria</legend>
            <div class="chips">
              <button class="chip" data-grupo="categoria" data-valor="sedan">Sedã</button>
              <button class="chip" data-grupo="categoria" data-valor="suv">SUV e picapes</button>
              <button class="chip" data-grupo="categoria" data-valor="compacto">Compactos</button>
            </div>
          </fieldset>

          <fieldset class="grupo-filtro">
            <legend>Amperagem</legend>
            <div class="chips">
              <button class="chip" data-grupo="amperagem" data-valor="45">45Ah</button>
              <button class="chip" data-grupo="amperagem" data-valor="60">60Ah</button>
              <button class="chip" data-grupo="amperagem" data-valor="75">75Ah</button>
            </div>
          </fieldset>

          <fieldset class="grupo-filtro">
            <legend>Etiquetas</legend>
            <div class="chips">
              <button class="chip" data-grupo="tag" data-valor="promocao">Promoção</button>
              <button class="chip" data-grupo="tag" data-valor="mais-vendida">Mais vendida</button>
              <button class="chip" data-grupo="tag" data-valor="diesel">Diesel</button>
            </div>
          </fieldset>

          <button class="limpar" id="limpar-filtros">Limpar filtros</button>
        </div>
      </div>
    </div>

    <p class="contador" id="contador"></p>

    <!-- Grade VAZIA: os cards são criados pelo script.js a partir de produtos.js -->
    <section class="grade" id="grade"></section>

    <p class="vazio" id="vazio" hidden>Nenhuma bateria encontrada. Tente outro termo ou remova os filtros.</p>
  </main>

  <footer class="rodape">
    <p>© 2026 Teste Baterias — catálogo demonstrativo</p>
  </footer>

  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
